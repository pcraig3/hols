          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
              examples:
                /provinces/100:
                  value:
                    error:
                      status: 400
                      message: "Bad Request: request/params/provinceId must be equal to one of the
                        allowed values: AB, BC, MB, NB, NL, NS, NT, NU, ON, PE, QC, SK, YT"
                      timestamp: '2026-11-12T01:13:51.461Z'
      operationId: Province
      description: Returns a Canadian province or territory with its associated holidays. Returns a 404 response for invalid abbreviations.
      parameters:
        - schema:
            type: integer
            default: 2026
