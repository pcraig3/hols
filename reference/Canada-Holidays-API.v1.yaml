                        holidays:
                          - id: 1
                            date: '2026-01-01'
                            nameEn: New Year’s Day
                            nameFr: Jour de l’An
                            federal: 1
                            observedDate: '2026-01-01'
                          - id: 5
                            date: '2026-02-16'
                            nameEn: Family Day
                            nameFr: Fête de la famille
                            federal: 0
                            observedDate: '2026-02-16'
                        nextHoliday:
                          id: 34
                          date: '2026-12-25'
                          nameEn: Christmas Day
                          nameFr: Noël
                          federal: 1
                          observedDate: '2026-12-25'
      operationId: Provinces
      parameters:
        - schema:
            type: integer
            default: 2026
            minimum: 2013
            maximum: 2038
          in: query
          description: A calendar year
          name: year
          allowEmptyValue: true
        - schema:
            type: string
            enum:
              - '1'
              - '0'
              - 'true'
              - 'false'
            default: 'false'
          in: query
          name: optional
          description: 'A boolean parameter. If false or 0 (default), will return only legislated holidays. If true or 1, will return optional holidays for that region (if available).'
          allowEmptyValue: true
      description: Returns provinces and territories in Canada. Each province or territory lists its associated holidays.
