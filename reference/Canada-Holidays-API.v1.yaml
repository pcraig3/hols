openapi: 3.0.0
info:
  title: Canada Holidays API
  version: 1.16.0
  description: 'This API lists public holidays observed federally and across Canada’s 13 provinces and territories.'
  contact:
    name: Paul Craig
    url: 'https://canada-holidays.ca/api'
    email: paul@pcraig.ca
  license:
    name: MIT
    url: 'https://github.com/pcraig3/hols/blob/main/LICENSE'
servers:
  - url: 'https://canada-holidays.ca'
paths:
  /api/v1:
    get:
      summary: root
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: A welcome message
                    example: Hello / Bonjour!
                  _links:
                    type: object
                    properties:
                      self:
                        type: object
                        properties:
                          href:
                            type: string
                            example: 'https://canada-holidays.ca/api/v1/'
                            description: Root domain
                      holidays:
                        type: object
                        properties:
                          href:
                            type: string
                            example: 'https://canada-holidays.ca/api/v1/holidays'
                            description: Domain to get all holidays
                      provinces:
                        type: object
                        properties:
                          href:
                            type: string
                            example: 'https://canada-holidays.ca/api/v1/provinces'
                            description: Domain to get all provinces
                      spec:
                        type: object
                        properties:
                          href:
                            type: string
                            example: 'https://canada-holidays.ca/api/v1/spec'
              examples:
                /:
                  value:
                    message: Hello / Bonjour! Welcome to the Canada Holidays API / Bienvenue dans
                      l’API canadienne des jours fériés
                    _links:
                      self:
                        href: https://canada-holidays.ca/api/v1/
                      holidays:
                        href: https://canada-holidays.ca/api/v1/holidays
                      provinces:
                        href: https://canada-holidays.ca/api/v1/provinces
                      spec:
                        href: https://canada-holidays.ca/api/v1/spec
      operationId: Root
      description: Returns a welcome message.
      tags:
        - info
  /api/v1/holidays:
    get:
      summary: Get all holidays
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  holidays:
                    type: array
                    items:
                      $ref: '#/components/schemas/Holiday'
              examples:
                /holidays:
                  value:
                    holidays:
                      - id: 1
                        date: '2026-01-01'
                        nameEn: New Year’s Day
                        nameFr: Jour de l’An
                        federal: 1
                        observedDate: '2026-01-01'
                        provinces:
                          - id: AB
                            nameEn: Alberta
                            nameFr: Alberta
                            sourceEn: General holidays in Alberta
                            sourceLinkEn: https://www.alberta.ca/alberta-general-holidays#jumplinks-2
                            sourceLink: https://www.alberta.ca/alberta-general-holidays#jumplinks-2
                          - id: BC
                            nameEn: British Columbia
                            nameFr: Colombie-Britannique
                            sourceEn: Statutory holidays in British Columbia
                            sourceLinkEn: https://www2.gov.bc.ca/gov/content/employment-business/employment-standards-advice/employment-standards/statutory-holidays
                            sourceLink: https://www2.gov.bc.ca/gov/content/employment-business/employment-standards-advice/employment-standards/statutory-holidays
                          - id: MB
                            nameEn: Manitoba
                            nameFr: Manitoba
                            sourceEn: What are the general holidays in Manitoba?
                            sourceFr: Quels sont les jours fériés au Manitoba?
                            sourceLinkEn: https://www.gov.mb.ca/labour/standards/doc,gen-holidays-after-april-30-07,factsheet.html#q12
                            sourceLinkFr: https://www.gov.mb.ca/labour/standards/doc,gen-holidays-after-april-30-07,factsheet.fr.html#q12
                            sourceLink: https://www.gov.mb.ca/labour/standards/doc,gen-holidays-after-april-30-07,factsheet.html#q12
                          - id: NB
                            nameEn: New Brunswick
                            nameFr: Nouveau-Brunswick
                            sourceEn: What are the 11 prescribed days of rest?
                            sourceFr: Quels sont les 11 jours prescrits de repos?
                            sourceLinkEn: https://www2.gnb.ca/content/gnb/en/departments/elg/local_government/content/governance/content/days_of_rest_act/faq.html#2
                            sourceLinkFr: https://www2.gnb.ca/content/gnb/fr/ministeres/egl/gouvernements_locaux/content/gouvernance/content/loi_su_les_jours_de_repos/faq.html#2
                            sourceLink: https://www2.gnb.ca/content/gnb/en/departments/elg/local_government/content/governance/content/days_of_rest_act/faq.html#2
                          - id: NL
                            nameEn: Newfoundland and Labrador
                            nameFr: Terre-Neuve-et-Labrador
                            sourceEn: 2026 Paid Holidays
                            sourceLinkEn: https://www.gov.nl.ca/exec/tbs/2026-paid-holidays-2/
                            sourceLink: https://www.gov.nl.ca/exec/tbs/2026-paid-holidays-2/
                          - id: NT
                            nameEn: Northwest Territories
                            nameFr: Territoires du Nord-Ouest
                            sourceEn: Statutory Holidays and Holiday Pay
                            sourceFr: Jours fériés et rémunération des jours fériés
                            sourceLinkEn: https://www.ece.gov.nt.ca/en/services/employment-standards/frequently-asked-questions#Statutory%20Holidays
                            sourceLinkFr: https://www.ece.gov.nt.ca/fr/services/employment-standards/foires-aux-questions#jours-f-ri-s-et-r-mun-ration-des-jours-f-ri-s
                            sourceLink: https://www.ece.gov.nt.ca/en/services/employment-standards/frequently-asked-questions#Statutory%20Holidays
                          - id: NS
                            nameEn: Nova Scotia
                            nameFr: Nouvelle-Écosse
                            sourceEn: Paid holidays in Nova Scotia
                            sourceFr: Jours fériés payés en Nouvelle-Écosse
                            sourceLinkEn: https://novascotia.ca/lae/employmentrights/holidaychart.asp
                            sourceLinkFr: https://novascotia.ca/lae/employmentrights/holidaychart-fr.asp
                            sourceLink: https://novascotia.ca/lae/employmentrights/holidaychart.asp
                          - id: NU
                            nameEn: Nunavut
                            nameFr: Nunavut
                            sourceEn: General Holidays
                            sourceFr: Jours fériés
                            sourceLinkEn: https://www.gov.nu.ca/en/employment-training-and-career-development/labour-and-employment-standards-nunavut#general-holidays
                            sourceLinkFr: https://www.gov.nu.ca/fr/emploi-formation-et-perfectionnement-professionnel/normes-du-travail-du-nunavut#general-holidays
                            sourceLink: https://www.gov.nu.ca/en/employment-training-and-career-development/labour-and-employment-standards-nunavut#general-holidays
                          - id: ON
                            nameEn: Ontario
                            nameFr: Ontario
                            sourceEn: Public holidays
                            sourceFr: Jours fériés
                            sourceLinkEn: https://www.ontario.ca/document/your-guide-employment-standards-act-0/public-holidays
                            sourceLinkFr: https://www.ontario.ca/fr/document/votre-guide-de-la-loi-sur-les-normes-demploi-0/jours-feries
                            sourceLink: https://www.ontario.ca/document/your-guide-employment-standards-act-0/public-holidays
                          - id: PE
                            nameEn: Prince Edward Island
                            nameFr: Île-du-Prince-Édouard
                            sourceEn: Paid Holidays
                            sourceLinkEn: https://www.princeedwardisland.ca/en/information/workforce-and-advanced-learning/paid-holidays
                            sourceLink: https://www.princeedwardisland.ca/en/information/workforce-and-advanced-learning/paid-holidays
                          - id: QC
                            nameEn: Quebec
                            nameFr: Québec
                            sourceEn: Statutory holidays in Quebec
                            sourceFr: Jours fériés au Québec
                            sourceLinkEn: https://www.cnesst.gouv.qc.ca/en/working-conditions/leave/statutory-holidays/statutory-holidays
                            sourceLinkFr: https://www.cnesst.gouv.qc.ca/fr/conditions-travail/conges/jours-feries/liste-jours-feries
                            sourceLink: https://www.cnesst.gouv.qc.ca/en/working-conditions/leave/statutory-holidays/statutory-holidays
                          - id: SK
                            nameEn: Saskatchewan
                            nameFr: Saskatchewan
                            sourceEn: List of Saskatchewan Public Holidays
                            sourceFr: Liste des jours fériés en Saskatchewan
                            sourceLinkEn: https://www.saskatchewan.ca/business/employment-standards/public-statutory-holidays/list-of-saskatchewan-public-holidays
                            sourceLinkFr: https://www.saskatchewan.ca/bonjour/working-jobs-and-pensions/employment-standards/vacations-holidays-leaves-and-absences/public-statutory-holidays
                            sourceLink: https://www.saskatchewan.ca/business/employment-standards/public-statutory-holidays/list-of-saskatchewan-public-holidays
                          - id: YT
                            nameEn: Yukon
                            nameFr: Yukon
                            sourceEn: Find a Yukon statutory holiday
                            sourceFr: Jours fériés au Yukon
                            sourceLinkEn: https://yukon.ca/en/doing-business/employer-responsibilities/find-yukon-statutory-holiday
                            sourceLinkFr: https://yukon.ca/fr/entreprises/obligations-de-lemployeur/jours-feries-au-yukon
                            sourceLink: https://yukon.ca/en/doing-business/employer-responsibilities/find-yukon-statutory-holiday
                      - id: 3
                        date: '2026-02-16'
                        nameEn: Louis Riel Day
                        nameFr: Journée Louis Riel
                        federal: 0
                        observedDate: '2026-02-16'
                        provinces:
                          - id: MB
                            nameEn: Manitoba
                            nameFr: Manitoba
                            sourceEn: What are the general holidays in Manitoba?
                            sourceFr: Quels sont les jours fériés au Manitoba?
                            sourceLinkEn: https://www.gov.mb.ca/labour/standards/doc,gen-holidays-after-april-30-07,factsheet.html#q12
                            sourceLinkFr: https://www.gov.mb.ca/labour/standards/doc,gen-holidays-after-april-30-07,factsheet.fr.html#q12
                            sourceLink: https://www.gov.mb.ca/labour/standards/doc,gen-holidays-after-april-30-07,factsheet.html#q12
      operationId: Holidays
      description: Returns Canadian public holidays. Each holiday lists the regions that observe it.
      parameters:
        - schema:
            type: integer
            default: 2026
            minimum: 2013
            maximum: 2038
          in: query
          description: A calendar year
          name: year
          allowEmptyValue: true
        - schema:
            type: string
            enum:
              - '1'
              - '0'
              - 'true'
              - 'false'
          in: query
          name: federal
          description: 'A boolean parameter. If true or 1, will return only federal holidays. If false or 0, will return no federal holidays.'
          allowEmptyValue: true
        - schema:
            type: string
            enum:
              - '1'
              - '0'
              - 'true'
              - 'false'
            default: 'false'
          in: query
          name: optional
          description: 'A boolean parameter. If false or 0 (default), will return only legislated holidays. If true or 1, will return optional holidays for that region (if available).'
          allowEmptyValue: true
      tags:
        - holidays
  /api/v1/provinces:
    get:
      summary: Get all provinces
      tags:
        - provinces
      responses:
        '200':
          description: OK
          headers: {}
          content:
