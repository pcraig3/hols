              nameEn: Christmas Day
              nameFr: Noël
              federal: 1
              observedDate: '2026-12-25'
      description: 'A Canadian province or territory '
      properties:
        id:
          type: string
          enum:
            - AB
            - BC
            - MB
            - NB
            - NL
            - NS
            - NT
            - NU
            - 'ON'
            - PE
            - QC
            - SK
            - YT
          example: MB
          description: Canadian province abbreviations
        nextHoliday:
          $ref: '#/components/schemas/Holiday'
        holidays:
          type: array
          items:
            $ref: '#/components/schemas/Holiday'
        nameFr:
          type: string
          description: French name
          example: Manitoba
        nameEn:
          type: string
          description: English name
          example: Manitoba
        sourceLink:
          type: string
          example: 'https://www.gov.mb.ca/labour/standards/doc,gen-holidays-after-april-30-07,factsheet.html#q12'
          format: uri
          pattern: https+
          description: English-language source URL. Preserved for backward compatibility and always equal to sourceLinkEn.
        sourceLinkEn:
          type: string
          example: 'https://www.gov.mb.ca/labour/standards/doc,gen-holidays-after-april-30-07,factsheet.html#q12'
          format: uri
          description: URL of the English-language official source page for this region.
        sourceLinkFr:
          type: string
          example: 'https://www.gov.mb.ca/labour/standards/doc,gen-holidays-after-april-30-07,factsheet.fr.html#q12'
          format: uri
          description: URL of the French-language official source page, when available. Omitted otherwise.
